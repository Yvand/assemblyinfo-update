name: 'Set AssemblyInfo Version'
description: 'Sets the assembly version number in the specified assembly info file(s)'
branding:
  icon: 'tag'
  color: 'orange'
inputs:
  assembly_version:
    description: 'version to set in AssemblyVersion, in SemVer format'
    required: true
  assembly_file_version:
    description: 'version to set in AssemblyFileVersion'
    required: true
  directory:
    description: 'Directory where assembly info file is located'
    default: '.\'
  filename:
    description: 'Filename for assembly info'
    default: 'AssemblyInfo.cs'
  recursive:
    description: 'If `true`, update all assembly info files including in files in subdirectories'
    default: 'true'
  copyright:
    description: 'Copyright to set'
    default: ''
runs:
  using: composite
  steps:
    - shell: pwsh
      id: setversion
      env:
        ASSEMBLY_VERSION:  ${{ inputs.assembly_version }}
        ASSEMBLY_FILE_VERSION:  ${{ inputs.assembly_file_version }}
        DIRECTORY:  ${{ inputs.directory }}
        FILENAME: ${{ inputs.filename }}
        RECURSIVE:  ${{ inputs.recursive }}
        COPYRIGHT:  ${{ inputs.copyright }}
      run: ${{ github.action_path }}\SetVersion.ps1
outputs:
  assembly_version:
    description: Version set in AssemblyVersion
    value: ${{steps.setversion.outputs.assembly_version}}
  assembly_file_version:
    description: Version set in AssemblyFileVersion
    value: ${{steps.setversion.outputs.assembly_file_version}}
    